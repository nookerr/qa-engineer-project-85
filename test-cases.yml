---
- summary: |
    Успешное создание игры и отложенный выбор языка программирования внутри матча
  requirement: |
    Выбор языка программирования выполняется непосредственно внутри игрового пространства после старта матча (отложенная инициализация языка)
  prerequisites: |
    Пользователь авторизован в системе Codebattle и находится в лобби
  test-data: |
    Уровень сложности задачи = elementary
    Тип соперника = bot
    Язык программирования = JavaScript
  steps:
    - Нажать кнопку «Create game» в лобби
    - Выбрать сложность elementary, соперника «Бот» и создать игру
    - В открывшемся игровом пространстве выбрать язык JavaScript в выпадающем списке над редактором
  expected-result: |
    Игра создается без предварительной привязки к языку, внутри матча шаблон кода в редакторе переключается на синтаксис JavaScript

- summary: |
    Успешное решение задачи и победа в матче против бота
  requirement: |
    Игрок может запускать проверку своего решения кнопкой «Check» неограниченное количество раз
  prerequisites: |
    Пользователь находится в активном матче против бота, выбрана задача уровня elementary
  test-data: |
    Задача = «Сумма двух чисел» (Sum of two numbers)
    Язык программирования = JavaScript
    Код решения = const solution = (a, b) => a + b; export default solution;
  steps:
    - Ввести код решения задачи в левый редактор кода
    - Нажать кнопку «Check»
  expected-result: |
    Все серверные тесты проходят успешно, появляется модальное окно с поздравлением о победе и пересчетом рейтинга игрока

- summary: |
    Изолированная проверка локального кода при отправке неверного решения
  requirement: |
    Серверные тесты запускаются исключительно для локального кода проверяющего игрока и не затрагивают код соперника
  prerequisites: |
    Пользователь находится в активном матче, в редакторе соперника есть корректный код
  test-data: |
    Некорректный код = const solution = (a, b) => a - b; export default solution;
  steps:
    - Ввести неверный код в свой левый редактор
    - Нажать кнопку «Check»
  expected-result: |
    Проверка запускается только для кода текущего игрока, во вкладке вывода отображается сообщение о проваленных тестах, матч продолжается

- summary: |
    Подключение второго игрока к ожидающей публичной игре из списка в лобби
  requirement: |
    Второй игрок может подключиться к ожидающей игре по нажатию «Connect to game» или по уникальной пригласительной ссылке
  prerequisites: |
    Подготовлены два авторизованных аккаунта (Игрок 1 и Игрок 2) в разных браузерах или в режиме инкогнито
  test-data: |
    Тип игры = публичная игра с другим игроком
  steps:
    - Игрок 1 нажимает «Create game» и создает публичную игру
    - Игрок 2 находит созданную игру в списке доступных игр в лобби и нажимает «Connect to game»
  expected-result: |
    Оба игрока переносятся в единое игровое пространство с двумя редакторами кода, заданием сверху и таймером матча

- summary: |
    Создание приватной игры и подключение второго игрока по уникальной ссылке
  requirement: |
    Второй игрок может подключиться к ожидающей игре по нажатию «Connect to game» или по уникальной пригласительной ссылке
  prerequisites: |
    Подготовлены два авторизованных аккаунта (Игрок 1 и Игрок 2) в разных окнах браузера
  test-data: |
    Тип игры = приватная игра по ссылке
  steps:
    - Игрок 1 создает приватную игру и копирует сгенерированную ссылку на комнату
    - Игрок 2 открывает скопированную ссылку в своем браузере
  expected-result: |
    Игрок 2 подключается к приватной комнате, начинается совместный матч между двумя участниками

- summary: |
    Синхронизация написания кода соперника в реальном времени через WebSocket
  requirement: |
    Игроки видят процесс написания кода соперником в реальном времени
  prerequisites: |
    Два авторизованных игрока находятся в активном совместном матче
  test-data: |
    Фрагмент кода = const testSync = 123;
  steps:
    - Игрок 1 вводит тестовый фрагмент кода в свой редактор
    - Игрок 2 наблюдает за правым редактором соперника на своем экране
  expected-result: |
    Введенный текст отображается в правом редакторе на экране Игрока 2 в реальном времени без перезагрузки страницы

- summary: |
    Поведение интерфейса у победителя и проигравшего после завершения матча
  requirement: |
    После победы у победителя блокируется кнопка «Check» и появляется кнопка «Exit» с возможностью остаться и просматривать код
  prerequisites: |
    Два авторизованных игрока находятся в активном совместном матче
  test-data: |
    Валидное решение текущей задачи
  steps:
    - Игрок 1 вводит верное решение и нажимает «Check»
    - Проверить состояние кнопок у Игрока 1 (победителя) и Игрока 2 (проигравшего)
  expected-result: |
    У победителя кнопка «Check» блокируется, появляется кнопка «Exit» и сохраняется доступ к просмотру кода; проигравший может продолжать редактировать и проверять свой код

- summary: |
    Восстановление игровой сессии после кратковременного обрыва соединения
  requirement: |
    Система поддерживает переподключение игрока и восстановление игровой сессии по ее ID при разрыве соединения
  prerequisites: |
    Пользователь находится в активном матче на странице игры (/games/<id>), открыта панель Chrome DevTools (вкладка Network)
  test-data: |
    Профиль сети DevTools = Offline на 5 секунд, затем No throttling
  steps:
    - Ввести часть кода в редактор
    - Включить режим Offline во вкладке Network на 5 секунд
    - Вернуть сетевое соединение в режим No throttling
  expected-result: |
    WebSocket-соединение автоматически восстанавливается, игрок остается в своей игровой сессии по ее ID без потери прогресса матча

- summary: |
    Просмотр таблицы рейтингов игроков и переключение фильтров периода
  requirement: |
    Пользователь может просматривать таблицу рейтингов игроков
  prerequisites: |
    Открыта главная страница или лобби Codebattle (https://hexlet.io)
  test-data: |
    Раздел = Rating / Leaderboard
  steps:
    - Перейти в раздел рейтинга игроков
    - Переключить вкладки фильтрации по периоду времени
  expected-result: |
    Отображается актуальный список игроков с указанием места в рейтинге, имени, количества очков и побед

- summary: |
    Досрочное завершение боя при сдаче одного из игроков
  requirement: |
    После поражения проигравший игрок может продолжать редактировать и проверять свой код или выйти из игры
  prerequisites: |
    Пользователь находится в активном матче против соперника
  test-data: |
    Кнопка досрочной сдачи «Give up»
  steps:
    - Нажать кнопку «Give up» на экране боя
    - Подтвердить действие в диалоговом окне
  expected-result: |
    Матч завершается досрочно, сдавшемуся игроку засчитывается поражение, а сопернику — победа

- summary: |
    Проверка адаптивной верстки основных разделов сайта на мобильном экране (375px)
  requirement: |
    Сайт имеет адаптивную верстку и удобен на мобильных устройствах
  prerequisites: |
    Открыт сайт https://hexlet.io в Chrome DevTools с включенной эмуляцией мобильного экрана (ширина 375px)
  test-data: |
    Разрешение экрана = 375x667
  steps:
    - Проверить отображение главной страницы и лобби со списком игр на ширине 375px
    - Открыть страницу игрового боя и проверить расположение редактора кода и кнопок
    - Перейти в раздел рейтинга игроков и проверить отображение таблицы
    - Перейти в раздел «Турниры» и открыть вкладку «История»
    - Открыть страницу профиля пользователя
  expected-result: |
    На всех страницах сайта элементы корректно адаптируются под ширину 375px, отсутствуют горизонтальная прокрутка и обрезание текста в таблицах
