---
- summary: |
    Успешное создание и запуск игры против бота
  requirement: |
    Пользователь должен иметь возможность играть против бота
  prerequisites: |
    Пользователь авторизован в системе Codebattle и находится в лобби
  test-data: |
    Уровень сложности задачи = elementary
    Тип соперника = bot
  steps:
    - Нажать кнопку создания новой игры
    - Выбрать уровень сложности задачи и тип соперника «Бот»
    - Подтвердить создание игры
  expected-result: |
    Открывается страница игрового боя с редактором кода, условием задачи и подключенным ботом-соперником

- summary: |
    Успешное решение задачи и победа в матче против бота
  requirement: |
    Пользователь должен иметь возможность выбрать язык программирования и запустить проверку своего решения
  prerequisites: |
    Пользователь находится в активном матче против бота, открыт редактор кода
  test-data: |
    Язык программирования = JavaScript
    Валидный код решения текущей задачи
  steps:
    - Выбрать язык программирования из выпадающего списка
    - Написать корректный код решения задачи в редакторе
    - Нажать кнопку проверки решения («Check»)
  expected-result: |
    Все тесты проходят успешно, отображается модальное окно с поздравлением о победе и изменением рейтинга игрока

- summary: |
    Отображение ошибки при отправке неверного решения задачи
  requirement: |
    Код пользователя должен изолированно и безопасно исполняться на сервере с проверкой по заданным тестам
  prerequisites: |
    Пользователь находится в активном матче, открыт редактор кода
  test-data: |
    Код с синтаксической ошибкой или неверным возвращаемым значением
  steps:
    - Ввести некорректный код в редактор
    - Нажать кнопку проверки решения («Check»)
  expected-result: |
    Во вкладке вывода тестов отображается сообщение об ошибке или проваленных тестах, матч продолжается

- summary: |
    Создание приватной игры и приглашение друга по уникальной ссылке
  requirement: |
    Пользователь должен иметь возможность пригласить друга на игру по уникальной ссылке
  prerequisites: |
    Пользователь авторизован в системе Codebattle и находится в лобби
  test-data: |
    Тип игры = приватная (с другом по ссылке)
  steps:
    - Нажать кнопку создания игры с другом
    - Скопировать сгенерированную уникальную ссылку на комнату
    - Открыть скопированную ссылку в другом браузере или режиме инкогнито под вторым аккаунтом
  expected-result: |
    Второй игрок успешно подключается к комнате и начинается совместный матч между двумя игроками

- summary: |
    Отображение прогресса и редактора кода соперника в реальном времени
  requirement: |
    Пользователь должен видеть процесс написания кода соперником в реальном времени
  prerequisites: |
    Два игрока находятся в активном совместном матче
  test-data: |
    Любой текст или фрагмент кода в редакторе второго игрока
  steps:
    - Ввести несколько строк кода в редакторе со стороны первого игрока
    - Посмотреть на панель редактора соперника со стороны второго игрока
  expected-result: |
    Введенный текст и количество пройденных тестов отображаются на экране соперника в реальном времени без перезагрузки страницы

- summary: |
    Просмотр таблицы рейтингов игроков (Leaderboard)
  requirement: |
    Пользователь должен иметь возможность просматривать таблицу рейтингов игроков
  prerequisites: |
    Открыта главная страница или лобби Codebattle
  test-data: |
    Период фильтрации = за неделю / за месяц / за все время
  steps:
    - Перейти в раздел рейтинга игроков (Rating / Leaderboard)
    - Переключить фильтры по периоду времени
  expected-result: |
    Отображается актуальный список игроков с указанием их места, имени, рейтинга и количества побед

- summary: |
    Корректное завершение боя при досрочном выходе (сдаче) игрока
  requirement: |
    Система должна корректно обрабатывать выход или обрыв соединения одного из игроков во время боя
  prerequisites: |
    Пользователь находится в активном матче против другого игрока или бота
  test-data: |
    Не требуются
  steps:
    - Нажать кнопку досрочного завершения боя («Give up» / «Сдаться»)
    - Подтвердить действие во всплывающем окне
  expected-result: |
    Матч завершается досрочно, текущему игроку засчитывается поражение, а сопернику — победа

- summary: |
    Корректное отображение таблицы турниров на мобильных устройствах (ширина экрана 375px)
  requirement: |
    Сайт должен быть удобным на мобильном устройстве
  prerequisites: |
    Открыта страница «Турниры» (https://hexlet.io) в браузере с шириной экрана 375px
  test-data: |
    Разрешение экрана = 375x667 (эмуляция мобильного устройства в Chrome DevTools)
  steps:
    - Открыть страницу «Турниры» в режиме эмуляции мобильного устройства (ширина 375px)
    - Переключиться на вкладку «История»
  expected-result: |
    Таблица турниров корректно адаптируется под ширину экрана, все столбцы и значения в колонке «Дата» отображаются полностью без обрезания
