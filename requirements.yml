---
functional:
  - Пользователь должен иметь возможность соревноваться с другим игроком в решении задач
  - Пользователь должен видеть процесс написания кода соперником в реальном времени
  - Пользователь должен иметь возможность играть против бота
  - Пользователь должен иметь возможность пригласить друга на игру по уникальной ссылке
  - Пользователь должен иметь возможность просматривать таблицу рейтингов игроков
  - Пользователь должен иметь возможность выбрать язык программирования и запустить проверку своего решения

non-functional:
  - Сайт должен быть разработан с учетом удобства использования и оптимизирован для скорости работы
  - Сайт должен быть безопасным и защищать данные пользователя
  - Сайт должен быть удобным на мобильном устройстве
  - Сайт должен быть протестирован на совместимость с последними версиями браузеров
  - Сайт должен быть способен обрабатывать большое количество трафика (например, 1000 одновременных пользователей)

implicit:
  - Код пользователя должен изолированно и безопасно исполняться на сервере с проверкой по заданным тестам
  - Рейтинг игроков должен автоматически и математически корректно пересчитываться после завершения матча
  - Система должна корректно обрабатывать выход или обрыв соединения одного из игроков во время боя
  - Интерфейс не должен содержать орфографических ошибок, битых ссылок и критических ошибок в консоли браузера
  - Состояние редактора кода и таймера матча должно синхронизироваться между игроками без заметных задержек
