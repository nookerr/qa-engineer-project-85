---
functional:
  - Авторизованный пользователь может создать новую игровую сессию с ботом или другим игроком по нажатию «Create game»
  - Выбор языка программирования выполняется непосредственно внутри игрового пространства после старта матча (отложенная инициализация языка)
  - Созданная игра переходит в режим ожидания и отображается в общем списке доступных для подключения игр
  - Второй игрок может подключиться к ожидающей игре по нажатию «Connect to game» или по уникальной пригласительной ссылке
  - В игровом пространстве отображаются два редактора кода (слева — свой, справа — соперника), блок с заданием сверху, таймер длительности игры и чат
  - Игроки видят процесс написания кода соперником в реальном времени
  - Игрок может запускать проверку своего решения кнопкой «Check» неограниченное количество раз
  - Матч не ограничен таймером на победу и продолжается до первого успешного решения одного из участников
  - После успешного прохождения тестов отображается модальное окно с объявлением победителя
  - После победы у победителя блокируется кнопка «Check» и появляется кнопка «Exit» с возможностью остаться и просматривать код
  - После поражения проигравший игрок может продолжать редактировать и проверять свой код или выйти из игры
  - Пользователь может просматривать таблицу рейтингов игроков

non-functional:
  - Сайт разработан с учетом удобства использования и оптимизирован для скорости работы
  - Обмен данными в матче (синхронизация редакторов кода, статусы игроков и чат) работает в реальном времени через WebSocket
  - Система поддерживает переподключение игрока и восстановление игровой сессии по ее ID при разрыве соединения
  - Сайт имеет адаптивную верстку и удобен на мобильных устройствах
  - Сайт корректно работает в последних версиях популярных браузеров
  - Сайт безопасен, изолированно исполняет пользовательский код и способен обрабатывать большое количество одновременного трафика (например, 1000 пользователей)

implicit:
  - Серверные тесты запускаются исключительно для локального кода проверяющего игрока и не затрагивают код соперника
  - Жизненный цикл игровой сессии управляется через состояния (active, finished, closed), а данные матча хранятся в памяти до выхода обоих участников
  - Итоговый рейтинг игроков автоматически и математически корректно пересчитывается после определения победителя
  - Интерфейс не содержит битых ссылок, обрезанных элементов верстки и критических ошибок в консоли браузера
